name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Generate overview card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=JoaoVictorAAbreu-Dev&show_icons=true&hide_border=true&include_all_commits=true&count_private=false&theme=transparent&title_color=0F766E&icon_color=0F766E&text_color=475569&custom_title=GitHub%20Overview"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=JoaoVictorAAbreu-Dev&layout=compact&langs_count=8&count_private=false&theme=transparent&title_color=0F766E&text_color=475569&custom_title=Most%20Used%20Languages"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile cards" || exit 0
          git push
